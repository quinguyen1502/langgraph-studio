<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Superstep docs have moved</title>
<script>
  // GitHub Pages serves this page for every missing path of the user site. The project was renamed from
  // langgraph-studio to superstep (TASK-0058): send /langgraph-studio/<page>#<hash> to the same page under /superstep/.
  (function () {
    var l = window.location, m = l.pathname.match(/^\/langgraph-studio(\/.*)?$/)
    if (m) l.replace('/superstep' + (m[1] || '/') + l.search + l.hash)
  })()
</script>
<style>
  :root { color-scheme: light dark; --bg: #fff; --fg: #18181b; --muted: #71717a; --link: #7c3aed }
  @media (prefers-color-scheme: dark) { :root { --bg: #09090b; --fg: #fafafa; --muted: #a1a1aa; --link: #a78bfa } }
  body { margin: 0; padding: 48px 16px; background: var(--bg); color: var(--fg); font: 16px/1.5 system-ui, sans-serif }
  main { max-width: 36rem; margin: 0 auto } p { color: var(--muted) } a { color: var(--link) }
</style>
</head>
<body>
<main>
  <h1>Page not found</h1>
  <p>LangGraph Studio is now <strong>Superstep</strong>. Its documentation lives at
    <a href="/superstep/">quinguyen1502.github.io/superstep</a>.</p>
</main>
</body>
</html>
