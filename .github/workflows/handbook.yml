name: Handbook

# Builds the MkDocs handbook on every change to it, and publishes it to GitHub
# Pages from main. Publishing needs Settings → Pages → Source: GitHub Actions.
on:
  pull_request:
    branches: [main, develop]
    paths: ['handbook/**', 'docs/api-errors.md', '.github/workflows/handbook.yml']
  push:
    branches: [main]
    paths: ['handbook/**', 'docs/api-errors.md', '.github/workflows/handbook.yml']
  workflow_dispatch:

concurrency:
  group: handbook-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: MkDocs strict build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: handbook
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: handbook/requirements.txt
      - name: Install toolchain
        run: pip install -r requirements.txt
      - name: Check every page has an en/vi pair
        run: |
          missing=0
          for f in $(find docs -name '*.en.md'); do
            [ -f "${f%.en.md}.vi.md" ] || { echo "missing ${f%.en.md}.vi.md"; missing=1; }
          done
          for f in $(find docs -name '*.vi.md'); do
            [ -f "${f%.vi.md}.en.md" ] || { echo "missing ${f%.vi.md}.en.md"; missing=1; }
          done
          exit $missing
      - name: Build
        run: mkdocs build --strict
      - if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: handbook/site

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
