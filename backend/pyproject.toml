[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "langgraph-studio-backend"
version = "0.1.0"
description = "FastAPI backend for LangGraph Studio (compiler, runner, auth, repo import)"
requires-python = ">=3.12"
dependencies = [
  "fastapi",
  "uvicorn[standard]",
  "langgraph",
  "httpx",
  "pyjwt",
  "python-multipart",
  "sqlalchemy>=2.0",
  "alembic>=1.13",
  "cryptography",
  "psycopg[binary]>=3.2",  # Postgres driver (DATABASE_URL=postgresql://...), TASK-0009
  "redis>=5",              # optional run bus (REDIS_URL), TASK-0009
  "fakeredis>=2.20",       # Redis contract tests without a server
  "pytest-cov",
  "pytest",  # test runner kept in base deps so `factory deps apply` (pip install -e .) can run verification
]

[project.optional-dependencies]
dev = []

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["imports", "fixtures", ".venv"]
