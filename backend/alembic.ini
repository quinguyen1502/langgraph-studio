# CLI use: cd backend && .venv/bin/alembic upgrade head   (URL from DATABASE_URL / STUDIO_DB)
[alembic]
script_location = app/migrations
prepend_sys_path = .

[loggers]
keys = root
[handlers]
keys = console
[formatters]
keys = generic
[logger_root]
level = WARN
handlers = console
[handler_console]
class = StreamHandler
args = (sys.stderr,)
formatter = generic
[formatter_generic]
format = %(levelname)s [%(name)s] %(message)s
