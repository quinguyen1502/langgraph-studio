<style>
  :root {
    --ink: #1d1b26;
    --brand: #6c4bd8;
    --brand-deep: #4b2fb0;
    --soft: #efeaff;
    --muted: #6b6878;
    --surface: #f6f5f9;
    --line: #e7e5ee;
    --ok: #13a36b;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { overflow: hidden; background: #fff; }
  body { width: 1920px; height: 1080px; position: relative; font-family: 'Inter', sans-serif; color: var(--ink); -webkit-font-smoothing: antialiased; }
  [data-in] { opacity: 0; will-change: transform, opacity, filter; }
  code, .mono { font-family: 'JetBrains Mono', monospace; }

  .center-stack { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 0 80px; }
  .line { font-size: 80px; font-weight: 800; letter-spacing: -2px; line-height: 1.2; }
  .line .soft { color: #a9a6b6; }
  .line.ask { color: var(--brand); margin-bottom: 12px; }

  .eyebrow { font-size: 24px; font-weight: 800; letter-spacing: 5px; color: var(--brand); text-transform: uppercase; margin-bottom: 24px; }
  .headline { font-size: 54px; font-weight: 900; letter-spacing: -2px; line-height: 1.08; }
  .body { font-size: 28px; font-weight: 600; line-height: 1.45; color: var(--muted); margin-top: 28px; }
  .body code { font-size: 26px; color: var(--brand-deep); background: var(--soft); padding: 2px 8px; border-radius: 8px; }
  .col { position: absolute; top: 0; height: 1080px; left: 100px; width: 480px; display: flex; flex-direction: column; justify-content: center; }

  /* browser window around the app screenshots */
  .browser { position: absolute; border-radius: 18px; overflow: hidden; background: #fff;
             box-shadow: 0 60px 120px -40px rgba(29,27,38,.45), 0 0 0 1px var(--line); }
  .browser .bar { height: 46px; background: var(--surface); border-bottom: 1px solid var(--line); display: flex; align-items: center; padding: 0 18px; gap: 9px; }
  .browser .bar > i { width: 13px; height: 13px; border-radius: 50%; display: block; }
  .browser .bar > i:nth-child(1) { background: #f26b5b; } .browser .bar > i:nth-child(2) { background: #f5bf4f; } .browser .bar > i:nth-child(3) { background: #5ec95a; }
  .browser .url { margin-left: 20px; flex: 1; max-width: 560px; height: 30px; border-radius: 15px; background: #fff; border: 1px solid var(--line);
                  display: flex; align-items: center; padding: 0 16px; font-size: 16px; font-weight: 600; color: var(--muted); }
  .browser .page { position: relative; width: 100%; aspect-ratio: 1.6; overflow: hidden; }
  .browser .page .zoom { position: absolute; inset: 0; transform-origin: 0 0; will-change: transform; }
  .browser .page img { position: absolute; left: 0; top: 0; width: 100%; height: 100%; display: block; }
  .hl { position: absolute; border-radius: 14px; border: 4px solid var(--brand); z-index: 4;
        box-shadow: 0 0 0 9999px rgba(29,27,38,.10), 0 0 40px rgba(108,75,216,.5); }

  .chips { position: absolute; display: flex; flex-wrap: wrap; gap: 12px; }
  .chip { display: inline-flex; align-items: center; gap: 10px; padding: 10px 20px 10px 14px; border-radius: 999px; font-size: 22px; font-weight: 800;
          background: var(--ink); color: #fff; white-space: nowrap; box-shadow: 0 10px 26px rgba(29,27,38,.22); }
  .chip i { width: 12px; height: 12px; border-radius: 50%; background: #a48bff; display: block; }

  .title-top { position: absolute; left: 0; right: 0; top: 96px; text-align: center; padding: 0 60px; }
  .title-top .body { margin: 18px auto 0; max-width: 1300px; }

  .term { position: absolute; left: 110px; top: 330px; width: 900px; height: 560px; border-radius: 18px; background: #17151f; color: #e8e6f0;
          box-shadow: 0 60px 120px -40px rgba(29,27,38,.55); overflow: hidden; }
  .term .bar { height: 46px; display: flex; align-items: center; gap: 9px; padding: 0 18px; background: #211e2b; }
  .term .bar > i { width: 13px; height: 13px; border-radius: 50%; display: block; background: #3a3647; }
  .term .bar > span { margin-left: 16px; font: 600 16px 'Inter'; color: #8e8a9e; }
  .term pre { font: 500 18px/1.65 'JetBrains Mono', monospace; padding: 26px 30px; white-space: pre-wrap; }
  .term .p { color: #a48bff; } .term .k { color: #7ee0b5; } .term .s { color: #f5c97b; } .term .dim { color: #8e8a9e; }
  .term .caret { display: inline-block; width: 11px; height: 24px; background: #a48bff; vertical-align: -4px; margin-left: 2px; }

  .tiles { position: absolute; left: 140px; right: 140px; top: 0; height: 1080px; display: flex; gap: 30px; align-items: center; }
  .tile { flex: 1; height: 470px; border-radius: 36px; background: var(--surface); padding: 46px 38px; display: flex; flex-direction: column; }
  .tile svg { flex: none; width: 72px; height: 72px; stroke: var(--brand); fill: none; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
  .tile h3 { font-size: 38px; font-weight: 900; margin-top: 44px; line-height: 1.15; letter-spacing: -.5px; min-height: 2.3em; }
  .tile p { font-size: 25px; font-weight: 600; color: var(--muted); margin-top: 14px; line-height: 1.42; }
  .tiles-head { position: absolute; left: 0; right: 0; top: 130px; text-align: center; font-size: 28px; font-weight: 800; letter-spacing: 6px; color: var(--brand); text-transform: uppercase; }

  .start-head { position: absolute; left: 0; right: 0; top: 150px; text-align: center; }
  .steps { position: absolute; left: 150px; right: 150px; top: 390px; height: 400px; display: flex; align-items: stretch; gap: 22px; }
  .step { flex: 1; border-radius: 36px; background: var(--surface); padding: 42px 40px; display: flex; flex-direction: column; }
  .step b { width: 62px; height: 62px; border-radius: 50%; background: var(--brand); color: #fff; font-size: 30px; font-weight: 900; display: flex; align-items: center; justify-content: center; }
  .step h3 { font-size: 44px; font-weight: 900; margin-top: auto; letter-spacing: -.5px; }
  .step p { font-size: 24px; font-weight: 600; color: var(--muted); margin-top: 14px; line-height: 1.4; min-height: 2.8em; }
  .step p code { font-size: 22px; color: var(--brand-deep); }
  .step-arrow { flex: none; align-self: center; display: block; }
  .step-arrow svg { display: block; width: 50px; height: 50px; stroke: #a9a6b6; fill: none; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }

  .icon { width: 200px; height: 200px; border-radius: 50px; overflow: hidden; box-shadow: 0 30px 70px -10px rgba(75,47,176,.45); }
  .icon img { width: 100%; height: 100%; display: block; }
  .wordmark { font-size: 140px; font-weight: 900; letter-spacing: -5px; line-height: 1; margin-top: 44px; }
  .tagline { font-size: 42px; font-weight: 700; color: var(--muted); margin-top: 26px; }
  .pills { display: flex; gap: 18px; justify-content: center; margin-top: 60px; }
  .pills > span { padding: 14px 28px; border-radius: 999px; background: var(--soft); color: var(--brand-deep); font-size: 28px; font-weight: 800; }
  #fade { position: absolute; inset: 0; background: #fff; opacity: 0; z-index: 100; }
</style>

    trigE: 'Trigger', trigH: 'Gọi từ bất kỳ dịch vụ nào.', schedUrl: 'studio.example.com · Lịch chạy',

const params = new URLSearchParams(location.search);
const LANG = params.get('lang') === 'vi' ? 'vi' : 'en';
document.documentElement.lang = LANG;
const S = STRINGS[LANG];
document.querySelectorAll('[data-t]').forEach(el => { el.innerHTML = S[el.dataset.t]; });
document.querySelectorAll('img[data-src]').forEach(img => { img.src = `../../handbook/docs/images/${LANG}/${img.dataset.src}.png`; });

const clamp = x => x < 0 ? 0 : x > 1 ? 1 : x;
const easeOut = t => 1 - Math.pow(1 - t, 4);
const easeIn = t => t * t * t;
const easeInOut = t => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
const num = (el, k, d) => el.dataset[k] !== undefined ? parseFloat(el.dataset[k]) : d;

const items = [...document.querySelectorAll('[data-in]')].map(el => ({
  el, tin: num(el, 'in'), d: num(el, 'd', 0.9), tout: num(el, 'out', Infinity), od: num(el, 'od', 0.55),
  y: num(el, 'y', 0), s: num(el, 's', 1), b: num(el, 'b', 0), oy: num(el, 'oy', -24),
}));

// Typed text: data-type="start,end" reveals data-full over that span.
const typers = [...document.querySelectorAll('[data-type]')].map(el => {
  const [a, b] = el.dataset.type.split(',').map(Number);
  return { el, a, b, full: el.dataset.full };
});
const caret = document.getElementById('caret');

// Camera on the tour window: [time, scale, x%, y%] keyframes, x/y the point that moves to the top-left.
const CAM = [[11.6, 1, 0, 0], [15.9, 1, 0, 0], [16.8, 1.4, -17, -5], [19.5, 1.4, -17, -5], [20.2, 1, 0, 0],
             [21.6, 1.55, -55, -22], [27.4, 1.55, -55, -22], [28.2, 1, 0, 0], [29.4, 1, 0, 0], [30.4, 1.35, 0, -35], [33.0, 1.35, 0, -35],
             [34.4, 1.6, -60, -60], [38.6, 1.6, -60, -60], [39.2, 1, 0, 0], [40.4, 1.35, 0, -35], [47.4, 1.35, 0, -35], [48.2, 1, 0, 0],
             [49.6, 1.5, -50, 0], [52.4, 1.5, -50, 0], [53.4, 1.5, -50, -14], [56, 1.5, -50, -14], [56.8, 1, 0, 0]];
const zoom = document.getElementById('zoom');
function camAt(t) {
  if (t <= CAM[0][0]) return CAM[0].slice(1);
  for (let i = 1; i < CAM.length; i++) if (t <= CAM[i][0]) {
    const a = CAM[i - 1], b = CAM[i], p = easeInOut((t - a[0]) / (b[0] - a[0]));
    return [1, 2, 3].map(j => a[j] + (b[j] - a[j]) * p);
  }
  return CAM[CAM.length - 1].slice(1);
}
document.querySelectorAll('[data-zoom]').forEach(el => {
  const [s, x, y] = el.dataset.zoom.split(',').map(Number);
  el.style.transform = `translate(${x}%, ${y}%) scale(${s})`;
});

window.DURATION = 90;
window.renderAt = function (t) {
  for (const it of items) {
    const pin = easeOut(clamp((t - it.tin) / it.d));
    const pout = easeIn(clamp((t - (it.tout - it.od)) / it.od));
    const op = pin * (1 - pout), st = it.el.style;
    st.opacity = op.toFixed(4);
    st.visibility = op <= 0.001 ? 'hidden' : 'visible';
    if (op <= 0.001) continue;
    const ty = it.y * (1 - pin) + it.oy * pout, sc = it.s + (1 - it.s) * pin;
    st.transform = `translate3d(0, ${ty.toFixed(2)}px, 0) scale(${sc.toFixed(4)})`;
    const blur = it.b * (1 - pin) + it.b * 0.6 * pout;
    st.filter = blur > 0.05 ? `blur(${blur.toFixed(2)}px)` : 'none';
  }
  for (const ty of typers) ty.el.textContent = ty.full.slice(0, Math.round(ty.full.length * clamp((t - ty.a) / (ty.b - ty.a))));
  if (caret) caret.style.opacity = t >= 58.4 && t < 61.6 && (t <= 61.2 || Math.floor(t * 3) % 2 === 0) ? 1 : 0;
  const [s, x, y] = camAt(t);
  zoom.style.transform = `translate(${x.toFixed(3)}%, ${y.toFixed(3)}%) scale(${s.toFixed(4)})`;
  document.getElementById('fade').style.opacity = clamp((t - 88.6) / 1.4).toFixed(4);
};
renderAt(0);
</script>
