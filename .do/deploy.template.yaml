# DigitalOcean App Platform "Deploy to DigitalOcean" template (docs/deploy/README.md#digitalocean-app-platform).
# App Platform has no persistent volumes, so this uses a managed Postgres database. Fill in the SECRET values
# (random strings, e.g. `openssl rand -hex 32`) on the review screen.
spec:
  name: superstep
  services:
    - name: web
      image:
        registry_type: GHCR
        registry: quinguyen1502
        repository: superstep
        tag: latest
      http_port: 8000
      instance_count: 1
      instance_size_slug: apps-s-1vcpu-1gb
      health_check:
        http_path: /api/health
        initial_delay_seconds: 20
      envs:
        - key: DATABASE_URL
          scope: RUN_TIME
          value: ${db.DATABASE_URL}
        - key: STUDIO_PUBLIC_URL
          scope: RUN_TIME
          value: ${APP_URL}
        - key: JWT_SECRET
          scope: RUN_TIME
          type: SECRET
          value: change-me-to-a-random-string
        - key: STUDIO_SECRET_KEY
          scope: RUN_TIME
          type: SECRET
          value: change-me-to-a-random-string
        - key: STUDIO_ADMIN_EMAILS
          scope: RUN_TIME
          value: you@example.com
        - key: OPENAI_API_KEY
          scope: RUN_TIME
          type: SECRET
          value: ""
  databases:
    - name: db
      engine: PG
      version: "17"
      production: false
