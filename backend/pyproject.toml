[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "langgraph-studio-backend"
version = "0.1.0"
description = "FastAPI backend for LangGraph Studio (compiler, runner, auth, repo import)"
requires-python = ">=3.12"
dependencies = [
  "fastapi",
  "uvicorn[standard]",
  "langgraph",
  "httpx",
  "pyjwt",
  "python-multipart",
  "cryptography",
  "pytest",  # test runner kept in base deps so `factory deps apply` (pip install -e .) can run verification
]

[project.optional-dependencies]
dev = []

[tool.setuptools]
packages = ["app", "app.sandbox"]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["imports", "fixtures", ".venv"]
