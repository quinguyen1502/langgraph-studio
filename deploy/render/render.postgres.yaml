# Render Blueprint, Postgres variant: the web service plus a Render Postgres database (no disk needed).
# Deploy: https://render.com/deploy?repo=https://github.com/quinguyen1502/superstep&path=deploy/render/render.postgres.yaml
services:
  - type: web
    name: superstep
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: starter
    healthCheckPath: /api/health
    autoDeployTrigger: "off"
    envVars:
      - key: DATABASE_URL
        fromDatabase: { name: superstep-db, property: connectionString }
      - key: JWT_SECRET
        generateValue: true
      - key: STUDIO_SECRET_KEY
        generateValue: true
      - key: STUDIO_ADMIN_EMAILS
        sync: false
      - key: STUDIO_PUBLIC_URL
        sync: false
      - key: OPENAI_API_KEY
        sync: false

databases:
  - name: superstep-db
    plan: basic-256mb  # the free plan works too, but Render deletes free databases after 30 days
    postgresMajorVersion: "17"
