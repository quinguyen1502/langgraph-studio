<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>LangGraph Studio quickstart</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700;800;900&family=JetBrains+Mono:wght@500;700&display=block" rel="stylesheet">
<style>
  :root { --ink: #1d1b26; --brand: #6c4bd8; --brand-deep: #4b2fb0; --soft: #efeaff; --muted: #6b6878; --line: #e2dfec; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { overflow: hidden; }
  body { width: 1920px; height: 1080px; position: relative; font-family: 'Inter', sans-serif; color: var(--ink); -webkit-font-smoothing: antialiased;
         background: radial-gradient(1400px 900px at 50% 0%, #f4f1ff 0%, #eceaf3 60%, #e6e3ef 100%); }
  code, kbd, .mono { font-family: 'JetBrains Mono', monospace; }
  .fx { opacity: 0; will-change: transform, opacity; }

  /* chapter rail */
  #rail { position: absolute; left: 0; right: 0; top: 26px; display: flex; justify-content: center; gap: 14px; }
  .chap { display: flex; align-items: center; gap: 12px; padding: 9px 22px 9px 10px; border-radius: 999px; font-size: 21px; font-weight: 800;
          color: var(--muted); background: rgba(255,255,255,.6); border: 1px solid var(--line); transition: none; }
  .chap b { width: 30px; height: 30px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 16px;
            background: #dedae9; color: var(--muted); }
  .chap.on { color: #fff; background: var(--ink); border-color: var(--ink); }
  .chap.on b { background: var(--brand); color: #fff; }
  .chap.done b { background: var(--brand); color: #fff; }

  /* browser window: the page is the 1440x900 viewport the frames were captured in, scaled down */
  #win { position: absolute; left: 296px; top: 96px; width: 1328px; border-radius: 16px; overflow: hidden; background: #fff;
         box-shadow: 0 50px 110px -40px rgba(29,27,38,.5), 0 0 0 1px rgba(29,27,38,.08); }
  #win .bar { height: 40px; background: #f6f5f9; border-bottom: 1px solid var(--line); display: flex; align-items: center; padding: 0 16px; gap: 8px; }
  #win .bar > i { width: 12px; height: 12px; border-radius: 50%; display: block; }
  #win .bar > i:nth-child(1) { background: #f26b5b; } #win .bar > i:nth-child(2) { background: #f5bf4f; } #win .bar > i:nth-child(3) { background: #5ec95a; }
  #win .url { margin-left: 18px; width: 520px; height: 26px; border-radius: 13px; background: #fff; border: 1px solid var(--line);
              display: flex; align-items: center; padding: 0 14px; font-size: 14px; font-weight: 600; color: var(--muted); }
  #page { position: relative; width: 1328px; height: 830px; overflow: hidden; }
  #stage { position: absolute; left: 0; top: 0; width: 1440px; height: 900px; transform-origin: 0 0; }
  #cam { position: absolute; left: 0; top: 0; width: 1440px; height: 900px; transform-origin: 0 0; will-change: transform; }
  #cam img { position: absolute; left: 0; top: 0; width: 1440px; height: 900px; display: block; }
  #wires { position: absolute; left: 0; top: 0; overflow: visible; }
  .ghost { position: absolute; width: 200px; padding: 10px 12px; border-radius: 12px; background: #fff; border: 1px solid #d9d6e3;
           box-shadow: 0 16px 34px rgba(29,27,38,.22); font-size: 15px; font-weight: 600; display: flex; gap: 10px; align-items: center; }
  .ghost i { width: 28px; height: 28px; border-radius: 7px; display: block; }
  #cursor { position: absolute; left: 0; top: 0; width: 34px; height: 34px; z-index: 20; will-change: transform; }
  #ripple { position: absolute; left: 0; top: 0; width: 60px; height: 60px; margin: -30px 0 0 -30px; border-radius: 50%; border: 4px solid var(--brand); z-index: 19; opacity: 0; }

  /* caption under the window */
  #cap { position: absolute; left: 0; right: 0; top: 986px; display: flex; justify-content: center; }
  .line { position: absolute; display: flex; align-items: center; gap: 16px; font-size: 31px; font-weight: 700; letter-spacing: -.3px; white-space: nowrap; }
  .line b { flex: none; width: 40px; height: 40px; border-radius: 50%; background: var(--brand); color: #fff; font-size: 20px; font-weight: 900;
            display: flex; align-items: center; justify-content: center; }
  .line code { font-size: 26px; color: var(--brand-deep); background: var(--soft); padding: 2px 10px; border-radius: 8px; }
  kbd { display: inline-block; font-size: 22px; font-weight: 700; padding: 3px 12px; border-radius: 8px; background: #fff; border: 1px solid #cfcbdc;
        box-shadow: 0 3px 0 #cfcbdc; color: var(--ink); margin: 0 2px; }

  /* terminal */
  #term { position: absolute; left: 930px; top: 300px; width: 900px; border-radius: 16px; background: #17151f; color: #e8e6f0; z-index: 30;
          box-shadow: 0 60px 120px -30px rgba(29,27,38,.6); overflow: hidden; }
  #term .tbar { height: 42px; display: flex; align-items: center; gap: 8px; padding: 0 16px; background: #211e2b; }
  #term .tbar > i { width: 12px; height: 12px; border-radius: 50%; display: block; background: #3a3647; }
  #term .tbar > span { margin-left: 14px; font: 600 15px 'Inter'; color: #8e8a9e; }
  #term pre { font: 500 18px/1.6 'JetBrains Mono', monospace; padding: 24px 28px 28px; white-space: pre-wrap; word-break: break-all; min-height: 380px; }
  .p { color: #a48bff; } .k { color: #7ee0b5; } .s { color: #f5c97b; } .dim { color: #8e8a9e; } .ok { color: #7ee0b5; font-weight: 700; }

  /* intro and outro */
  .center { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
  .logo { width: 150px; height: 150px; border-radius: 38px; overflow: hidden; box-shadow: 0 30px 70px -10px rgba(75,47,176,.45); }
  .logo img { width: 100%; height: 100%; display: block; }
  .word { font-size: 112px; font-weight: 900; letter-spacing: -4px; line-height: 1; margin-top: 38px; }
  .sub { font-size: 38px; font-weight: 700; color: var(--muted); margin-top: 24px; }
  .cmd { margin-top: 46px; font: 700 30px 'JetBrains Mono', monospace; background: #17151f; color: #e8e6f0; padding: 20px 34px; border-radius: 16px; }
  .cmd .p { color: #a48bff; }
  .url2 { margin-top: 26px; font-size: 30px; font-weight: 800; color: var(--brand-deep); }
  #fade { position: absolute; inset: 0; background: #fff; opacity: 0; z-index: 100; }
</style>
</head>
<body>

<div id="rail" class="fx"></div>

<div id="win" class="fx">
  <div class="bar"><i></i><i></i><i></i><div class="url">studio.example.com/workflows</div></div>
  <div id="page"><div id="stage">
    <div id="cam">
      <div id="frames"></div>
      <svg id="wires" width="1440" height="900"></svg>
      <div class="ghost fx" id="ghost-llm"><i style="background:#ece6ff"></i>LLM</div>
      <div class="ghost fx" id="ghost-human"><i style="background:#fde7f1"></i>Human</div>
    </div>
    <div id="ripple"></div>
    <svg id="cursor" class="fx" viewBox="0 0 24 24"><path d="M4 2.5l15 9.2-6.6 1.3 3.9 7.4-2.9 1.5-3.9-7.4L4.8 19z" fill="#1d1b26" stroke="#fff" stroke-width="1.6" stroke-linejoin="round"/></svg>
  </div></div>
</div>

<div id="cap"></div>

<div id="term" class="fx">
  <div class="tbar"><i></i><i></i><i></i><span>billing-service · zsh</span></div>
  <pre><span class="p">$ </span><span id="typed"></span>
<span id="resp" class="fx"></span></pre>
</div>

<div class="center">
  <div class="logo fx" data-a="0.2,4.2"><img src="../../handbook/docs/en/assets/logo.svg"></div>
  <div class="word fx" data-a="0.6,4.3">LangGraph Studio</div>
  <div class="sub fx" data-a="1.2,4.4" data-t="intro"></div>
</div>

<div class="center">
  <div class="logo fx" data-a="78.4"><img src="../../handbook/docs/en/assets/logo.svg"></div>
  <div class="word fx" data-a="78.8" style="font-size:96px">LangGraph Studio</div>
  <div class="sub fx" data-a="79.4" data-t="outro"></div>
  <div class="cmd fx" data-a="80.2"><span class="p">$ </span>git clone …/langgraph-studio &amp;&amp; ./dev.sh</div>
  <div class="url2 fx" data-a="80.8">quinguyen1502.github.io/langgraph-studio</div>
</div>

<div id="fade"></div>

<script>
const STRINGS = {
  en: {
    intro: 'From a blank canvas to an HTTP endpoint, in five steps.',
    outro: 'Self-hosted. Built on LangGraph, FastAPI and React Flow.',
    chapters: ['Create', 'Build', 'Configure', 'Run', 'Ship'],
    create: 'Create a workflow: <b2>New workflow</b2> → <b2>Blank workflow</b2>',
    drag: 'Drag an <code>LLM</code> and a <code>Human</code> node from the palette',
    wire: 'Remove the old edge, then wire Start → LLM → Human → End',
    tidy: '<kbd>Shift</kbd><kbd>L</kbd> tidies the graph',
    prompt: 'Write the prompt. <code>{{state.message}}</code> reads the run input',
    output: 'Add a <code>reply</code> field to the state and write the answer to it',
    human: 'The Human node asks before the reply goes out',
    save: 'Save. Every save is a new version',
    input: 'Run it with a JSON input',
    wait: 'The run stops at the Human node, with its state checkpointed',
    approve: 'Approve, and the run finishes',
    diff: 'Each step keeps its input, output and state diff',
    token: 'Create a token for the service that will call it',
    curl: 'That service starts a run over HTTP: <code>202 queued</code>',
    cron: 'Or run it on a cron schedule, in its own time zone',
    history: 'History lists both runs. The API run waits for approval',
  },
  vi: {
    intro: 'Từ canvas trống tới một endpoint HTTP, qua năm bước.',
    outro: 'Tự host. Xây trên LangGraph, FastAPI và React Flow.',
    chapters: ['Tạo', 'Dựng', 'Cấu hình', 'Chạy', 'Đưa vào dùng'],
    create: 'Tạo workflow: <b2>Workflow mới</b2> → <b2>Workflow trống</b2>',
    drag: 'Kéo một node <code>LLM</code> và một node <code>Human</code> từ palette',
    wire: 'Xoá cạnh cũ, rồi nối Start → LLM → Human → End',
    tidy: '<kbd>Shift</kbd><kbd>L</kbd> sắp xếp lại graph',
    prompt: 'Viết prompt. <code>{{state.message}}</code> đọc từ input của run',
    output: 'Thêm field <code>reply</code> vào state và ghi câu trả lời vào đó',
    human: 'Node Human hỏi trước khi câu trả lời được gửi đi',
    save: 'Lưu. Mỗi lần lưu là một phiên bản mới',
    input: 'Chạy với một input JSON',
    wait: 'Run dừng ở node Human, state được lưu checkpoint',
    approve: 'Duyệt, và run chạy tiếp tới hết',
    diff: 'Mỗi bước giữ input, output và state diff',
    token: 'Tạo token cho dịch vụ sẽ gọi workflow',
    curl: 'Dịch vụ đó khởi chạy run qua HTTP: <code>202 queued</code>',
    cron: 'Hoặc chạy theo lịch cron, theo múi giờ riêng',
    history: 'Lịch sử có cả hai run. Run qua API đang chờ duyệt',
  },
}

const LANG = new URLSearchParams(location.search).get('lang') === 'vi' ? 'vi' : 'en'
document.documentElement.lang = LANG
const S = STRINGS[LANG]
// flow.json from e2e/quickstart.spec.ts: the box of every control, per frame. render.mjs injects it.
const FLOW = window.FLOW || (() => { const x = new XMLHttpRequest(); x.open('GET', `build/frames/${LANG}/flow.json`, false); x.send(); return JSON.parse(x.responseText) })()
const tg = (frame, key) => { const b = FLOW.frames[frame].targets[key]; if (!b) throw new Error(`no target ${frame}.${key}`); return b }
const mid = (frame, key) => { const [x, y, w, h] = tg(frame, key); return [x + w / 2, y + h / 2] }

const clamp = x => x < 0 ? 0 : x > 1 ? 1 : x
const easeOut = t => 1 - Math.pow(1 - t, 3)
const easeInOut = t => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2
const lerp = (a, b, p) => a + (b - a) * p

// ---- the script ---------------------------------------------------------------------------------
const FR = [], CUR = [], CAM = [], CAPS = [], CLICKS = [], DRAGS = [], WIRES = []
const show = (name, t) => FR.push({ name, t })
const move = (p, t0, t1, down = false) => CUR.push({ p, t0, t1, down })
const click = t => CLICKS.push(t)
const cap = (key, chapter, t0, t1) => CAPS.push({ key, chapter, t0, t1 })
const cam = (t, s, p) => CAM.push({ t, s, p })                    // zoom s around page point p
const camAt = (t0, t1, s, p) => { cam(t0, CAM.length ? CAM[CAM.length - 1].s : 1, CAM.length ? CAM[CAM.length - 1].p : [720, 450]); cam(t1, s, p) }
const home = [720, 450]

cam(0, 1, home)
// 1 Create
show('list', 0)
move(mid('list', 'newWf'), 5.6, 6.6); click(6.8); show('gallery', 7.0)
cap('create', 0, 5.6, 9.6)
move(mid('gallery', 'blank'), 7.6, 8.6); click(8.8); show('blank', 9.1)
// 2 Build: drag two nodes, wire them, tidy
cap('drag', 1, 9.8, 14.4)
move(mid('blank', 'llm'), 9.8, 10.6); move(mid('blank', 'dropLlm'), 10.9, 11.9, true)
DRAGS.push({ el: 'ghost-llm', t0: 10.85, t1: 11.9, out: 14.5 })
move(mid('blank', 'human'), 12.2, 12.9); move(mid('blank', 'dropHuman'), 13.2, 14.1, true)
DRAGS.push({ el: 'ghost-human', t0: 13.15, t1: 14.1, out: 14.5 })
show('dropped', 14.4)
cap('wire', 1, 14.6, 18.6)
const wire = (a, b, t0, t1) => { move(mid('dropped', a), t0 - 0.6, t0); move(mid('dropped', b), t0 + 0.05, t1, true); WIRES.push({ a: mid('dropped', a), b: mid('dropped', b), t0, t1, out: 19.3 }) }
wire('startOut', 'llmIn', 15.3, 16.1); wire('llmOut', 'humanIn', 16.8, 17.5); wire('humanOut', 'endIn', 18.2, 18.9)
cap('tidy', 1, 18.7, 21.0); show('wired', 19.4)
camAt(19.6, 20.5, 1.6, (([x, y]) => [x + 150, y])(mid('wired', 'llm')))
// 3 Configure
move(mid('wired', 'llm'), 21.0, 21.8); click(22.0); show('llm-selected', 22.2)
const promptAt = mid('llm-selected', 'prompt')
camAt(22.4, 23.4, 1.75, promptAt)
cap('prompt', 2, 22.4, 27.0)
show('llm-config', 25.0)
camAt(27.0, 28.0, 1.75, mid('llm-config', 'state')); cap('output', 2, 27.0, 30.6)
camAt(28.8, 29.8, 1.75, mid('llm-config', 'output'))
camAt(30.2, 30.9, 1, home)
move(mid('llm-config', 'human'), 30.6, 31.3); click(31.5); show('human-config', 31.7)
camAt(31.9, 32.8, 1.75, mid('human-config', 'prompt')); cap('human', 2, 31.8, 35.2)
camAt(34.6, 35.3, 1, home)
move(mid('human-config', 'save'), 35.3, 36.1); click(36.3); show('graph', 36.5); cap('save', 2, 36.3, 38.6)
// 4 Run
move(mid('graph', 'input'), 38.4, 39.1); click(39.3); show('input', 39.5)
camAt(39.7, 40.5, 1.5, [560, 760]); cap('input', 3, 39.6, 43.0)
camAt(41.8, 42.4, 1, home)
move(mid('input', 'run'), 42.2, 42.9); click(43.1); show('waiting', 43.4)
camAt(43.6, 44.4, 1.3, (([x, y, w, h]) => [x + w * 0.32, y + h / 2])(tg('waiting', 'panel'))); cap('wait', 3, 43.5, 47.6)
move(mid('waiting', 'approve'), 46.4, 47.1); click(47.3); show('done', 47.6)
camAt(47.8, 48.4, 1.3, [560, 520]); cap('approve', 3, 47.6, 50.4)
camAt(50.0, 50.6, 1, home)
move(mid('done', 'llm'), 50.4, 51.0); click(51.2); show('diff', 51.4)
camAt(51.6, 52.4, 1.6, mid('diff', 'diff')); cap('diff', 3, 51.5, 55.4)
camAt(54.8, 55.4, 1, home)
// 5 Ship
move(mid('diff', 'more'), 55.4, 56.0); click(56.2); show('more', 56.4)
move(mid('more', 'api'), 56.5, 57.1); click(57.3); show('api', 57.5)
camAt(57.6, 58.4, 1.35, mid('api', 'name')); cap('token', 4, 57.5, 61.4)
move(mid('api', 'create'), 58.5, 59.2); click(59.4); show('token', 59.6)
camAt(61.0, 61.6, 1, home)
const TERM = { tin: 61.6, tout: 67.8, type0: 62.2, type1: 64.6, resp: 65.1 }
cap('curl', 4, 61.6, 67.8)
show('schedule', 68.0)
camAt(68.2, 69.0, 1.45, mid('schedule', 'preview')); cap('cron', 4, 68.0, 72.6)
move(mid('schedule', 'create'), 70.4, 71.1); click(71.3); show('scheduled', 71.5)
camAt(72.4, 73.0, 1, home)
show('history', 73.0)
camAt(73.3, 74.1, 1.5, [480, 740]); cap('history', 4, 73.0, 77.4)
const WIN = { tin: 4.6, tout: 77.8 }, CURSOR = { tin: 5.4, tout: 77.4 }
window.DURATION = 86.6

// ---- build the DOM ------------------------------------------------------------------------------
document.querySelectorAll('[data-t]').forEach(el => { el.textContent = S[el.dataset.t] })
const framesEl = document.getElementById('frames')
const frameEls = FR.map(f => { const img = document.createElement('img'); img.src = `build/frames/${LANG}/${f.name}.png`; img.style.opacity = 0; framesEl.appendChild(img); return img })
const rail = document.getElementById('rail')
const chapEls = S.chapters.map((c, i) => { const d = document.createElement('div'); d.className = 'chap'; d.innerHTML = `<b>${i + 1}</b>${c}`; rail.appendChild(d); return d })
const capEl = document.getElementById('cap')
const capEls = CAPS.map(c => { const d = document.createElement('div'); d.className = 'line fx'
  d.innerHTML = `<b>${c.chapter + 1}</b><span>${S[c.key].replace(/<b2>(.*?)<\/b2>/g, '<strong>$1</strong>')}</span>`; capEl.appendChild(d); return d })
const wiresEl = document.getElementById('wires')
const wireEls = WIRES.map(() => { const p = document.createElementNS('http://www.w3.org/2000/svg', 'path'); p.setAttribute('fill', 'none'); p.setAttribute('stroke', '#b1b1b7'); p.setAttribute('stroke-width', '1.6'); wiresEl.appendChild(p); return p })
const term = { el: document.getElementById('term'), typed: document.getElementById('typed'), resp: document.getElementById('resp') }
const call = `curl -X POST https://studio.example.com${FLOW.api.path} \\\n  -H "Authorization: Bearer wft_••••" \\\n  -d '${JSON.stringify(FLOW.api.body)}'`
const r = FLOW.api.response.data
term.resp.innerHTML = `<span class="ok">HTTP ${FLOW.api.status} Accepted</span>\n<span class="dim">{</span> <span class="k">"success"</span>: true, <span class="k">"data"</span>: {\n    <span class="k">"run_id"</span>: <span class="s">"${r.run_id}"</span>,\n    <span class="k">"status"</span>: <span class="s">"${r.status}"</span>,\n    <span class="k">"poll_url"</span>: <span class="s">"…/runs/${r.run_id}"</span> } <span class="dim">}</span>`
const fixed = [...document.querySelectorAll('[data-a]')].map(el => { const [a, b] = el.dataset.a.split(',').map(Number); return { el, a, b: b ?? Infinity } })

// ---- render one moment --------------------------------------------------------------------------
const STAGE = 1328 / 1440
document.getElementById('stage').style.transform = `scale(${STAGE})`
function fadeIO(t, tin, tout, d = 0.5) { return easeOut(clamp((t - tin) / d)) * (1 - easeOut(clamp((t - (tout - d)) / d))) }
function setFx(el, op, dy = 0, sc = 1) {
  el.style.opacity = op.toFixed(4); el.style.visibility = op < 0.002 ? 'hidden' : 'visible'
  el.style.transform = `translate3d(0, ${dy.toFixed(2)}px, 0) scale(${sc.toFixed(4)})`
}
function camera(t) {
  let a = CAM[0], b = CAM[0]
  for (let i = 0; i < CAM.length; i++) { if (CAM[i].t <= t) { a = CAM[i]; b = CAM[i + 1] || CAM[i] } }
  const p = b === a ? 1 : easeInOut(clamp((t - a.t) / (b.t - a.t)))
  const s = lerp(a.s, b.s, p), cx = lerp(a.p[0], b.p[0], p), cy = lerp(a.p[1], b.p[1], p)
  const tx = Math.min(0, Math.max(1440 - 1440 * s, 720 - cx * s)), ty = Math.min(0, Math.max(900 - 900 * s, 450 - cy * s))
  return { s, tx, ty }
}
function pointer(t) {
  let at = CUR[0].p, down = false
  for (const m of CUR) {
    if (t >= m.t1) { at = m.p; continue }
    if (t >= m.t0) { const from = at; const p = easeInOut((t - m.t0) / (m.t1 - m.t0)); at = [lerp(from[0], m.p[0], p), lerp(from[1], m.p[1], p)]; down = m.down }
    break
  }
  return { at, down }
}
// The cursor starts in the middle of the page
CUR.unshift({ p: [720, 470], t0: 0, t1: 0 })

window.renderAt = function (t) {
  setFx(document.getElementById('win'), fadeIO(t, WIN.tin, WIN.tout, 0.9), 220 * (1 - easeOut(clamp((t - WIN.tin) / 0.9))) - 160 * easeOut(clamp((t - WIN.tout + 0.8) / 0.8)))
  setFx(rail, fadeIO(t, WIN.tin + 0.3, WIN.tout, 0.6))
  const chapter = [...CAPS].reverse().find(c => t >= c.t0)?.chapter ?? -1
  chapEls.forEach((el, i) => { el.className = 'chap' + (i === chapter ? ' on' : i < chapter ? ' done' : '') })

  FR.forEach((f, i) => { const next = FR[i + 1]; const op = clamp((t - f.t) / 0.28) * (next && t > next.t + 0.3 ? 0 : 1); frameEls[i].style.opacity = op.toFixed(4) })
  const c = camera(t)
  document.getElementById('cam').style.transform = `translate(${c.tx.toFixed(2)}px, ${c.ty.toFixed(2)}px) scale(${c.s.toFixed(4)})`
  const scr = ([x, y]) => [c.tx + x * c.s, c.ty + y * c.s]

  const { at, down } = pointer(t)
  const [sx, sy] = scr(at)
  const cur = document.getElementById('cursor')
  setFx(cur, fadeIO(t, CURSOR.tin, CURSOR.tout, 0.4))
  cur.style.transform = `translate(${(sx - 6).toFixed(1)}px, ${(sy - 4).toFixed(1)}px) scale(${down ? 0.86 : 1})`
  const rip = document.getElementById('ripple')
  const k = CLICKS.find(tc => t >= tc && t < tc + 0.55)
  if (k !== undefined) { const p = (t - k) / 0.55; rip.style.opacity = (1 - p).toFixed(3); rip.style.transform = `translate(${sx}px, ${sy}px) scale(${0.4 + p})` } else rip.style.opacity = 0

  for (const d of DRAGS) {
    const el = document.getElementById(d.el)
    const op = t < d.t0 ? 0 : t < d.out ? 0.95 : Math.max(0, 0.95 - (t - d.out) / 0.3)
    setFx(el, op)
    const p = t < d.t1 ? pointer(t).at : pointer(d.t1 + 0.001).at
    el.style.transform = `translate(${(p[0] - 30).toFixed(1)}px, ${(p[1] - 20).toFixed(1)}px)`
  }
  WIRES.forEach((w, i) => {
    const el = wireEls[i]
    if (t < w.t0 || t > w.out) { el.setAttribute('d', ''); return }
    const p = easeInOut(clamp((t - w.t0) / (w.t1 - w.t0)))
    const b = [lerp(w.a[0], w.b[0], p), lerp(w.a[1], w.b[1], p)], dx = Math.max(40, Math.abs(b[0] - w.a[0]) / 2)
    el.setAttribute('d', `M${w.a[0]},${w.a[1]} C${w.a[0] + dx},${w.a[1]} ${b[0] - dx},${b[1]} ${b[0]},${b[1]}`)
  })

  CAPS.forEach((cp, i) => { const op = fadeIO(t, cp.t0, cp.t1, 0.35); setFx(capEls[i], op, 14 * (1 - easeOut(clamp((t - cp.t0) / 0.35)))) ; capEls[i].style.left = '50%'; capEls[i].style.translate = '-50% 0' })

  setFx(term.el, fadeIO(t, TERM.tin, TERM.tout, 0.6), 200 * (1 - easeOut(clamp((t - TERM.tin) / 0.6))))
  term.typed.textContent = call.slice(0, Math.round(call.length * clamp((t - TERM.type0) / (TERM.type1 - TERM.type0))))
  setFx(term.resp, clamp((t - TERM.resp) / 0.3))

  for (const f of fixed) setFx(f.el, fadeIO(t, f.a, f.b, 0.6), 30 * (1 - easeOut(clamp((t - f.a) / 0.6))))
  document.getElementById('fade').style.opacity = clamp((t - (window.DURATION - 1.2)) / 1.2).toFixed(4)
}
renderAt(0)
</script>
</body>
</html>
