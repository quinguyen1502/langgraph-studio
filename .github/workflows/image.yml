# All-in-one image (root Dockerfile): build, smoke test on SQLite and on Postgres, Trivy scan, then publish to GHCR on
# develop and on release tags (vX.Y.Z). Only GITHUB_TOKEN is used; nothing secret is passed to the build.
name: Image

on:
  push:
    branches: [develop]
    tags: ["v*"]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: true

env:
  SMOKE_EMAIL: ci-admin@example.com
  SMOKE_PASSWORD: Ci-smoke-pass-1

jobs:
  test:
    name: All-in-one image (build + SQLite/Postgres smoke + Trivy)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env: { POSTGRES_USER: studio, POSTGRES_PASSWORD: studio, POSTGRES_DB: studio }
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U studio" --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          tags: superstep:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - run: pip install httpx websockets
      - name: Smoke on SQLite (volume, production mode, admin from env)
        run: |
          docker run -d --name sq -p 8000:8000 -v sqdata:/data -e JWT_SECRET=ci-jwt-$GITHUB_RUN_ID-0123456789abcdef \
            -e STUDIO_SECRET_KEY=ci-key-$GITHUB_RUN_ID -e STUDIO_ADMIN_EMAILS=$SMOKE_EMAIL -e STUDIO_ADMIN_PASSWORD=$SMOKE_PASSWORD superstep:ci
          scripts/image_smoke.sh http://localhost:8000 sq
          docker restart sq && scripts/image_smoke.sh http://localhost:8000 sq   # data and sign-in survive a restart
          docker exec sq deno --version && docker exec sq sh -c 'test -w /data && ls /data'
      - name: Smoke on Postgres (postgres:// URL, generated admin password)
        run: |
          docker run -d --name pg --network host -e PORT=8001 -e DATABASE_URL=postgres://studio:studio@localhost:5432/studio \
            -e JWT_SECRET=ci-jwt-$GITHUB_RUN_ID-0123456789abcdef -e STUDIO_SECRET_KEY=ci-key-$GITHUB_RUN_ID -e STUDIO_ADMIN_EMAILS=$SMOKE_EMAIL superstep:ci
          until curl -fsS http://localhost:8001/api/health >/dev/null 2>&1; do sleep 1; done
          pw=$(docker logs pg 2>&1 | sed -n 's/.*change it now): \([^ ]*\).*/\1/p' | head -1)
          test -n "$pw" && SMOKE_PASSWORD=$pw scripts/image_smoke.sh http://localhost:8001 pg
      - name: Production refuses a missing STUDIO_SECRET_KEY
        run: |
          if docker run --rm -e JWT_SECRET=ci-jwt-0123456789abcdef0123456789 superstep:ci python -c "import app.main"; then
            echo "started without STUDIO_SECRET_KEY" >&2; exit 1; fi
      - if: failure()
        run: docker logs sq || true; docker logs pg || true
      - name: Trivy (fail on fixable CRITICAL)
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # 0.35.0 (immutable; earlier tags were compromised in March 2026)
        with:
          version: v0.69.3
          image-ref: superstep:ci
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          format: table

  publish:
    name: Publish to GHCR
    needs: test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}},enable=${{ !startsWith(github.ref, 'refs/tags/v0.') }}
            type=raw,value=develop,enable=${{ github.ref == 'refs/heads/develop' }}
            type=sha,prefix=sha-
          labels: |
            org.opencontainers.image.title=Superstep
            org.opencontainers.image.description=Visual LangGraph studio (all-in-one image)
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          provenance: true
