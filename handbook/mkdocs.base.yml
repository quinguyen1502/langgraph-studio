# Settings shared by the English (mkdocs.yml) and Vietnamese (mkdocs.vi.yml) sites.
# Lists such as nav and palette are not merged by INHERIT, so each site file defines its own.
site_name: Superstep

repo_url: https://github.com/quinguyen1502/superstep
repo_name: superstep
strict: true
validation:
  anchors: warn
  unrecognized_links: warn

theme:
  name: material
  variant: modern
  logo: assets/logo.svg
  favicon: assets/logo.svg
  icon:
    repo: fontawesome/brands/github
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.indexes
    - navigation.top
    - navigation.path
    - navigation.footer
    - search.highlight
    - search.suggest
    - toc.follow
    - content.code.copy
    - content.code.annotate
    - content.tabs.link

extra_css:
  - stylesheets/extra.css

copyright: Superstep · Qui Nguyen · 2026

extra:
  alternate:
    - name: English
      link: /superstep/
      lang: en
    - name: Tiếng Việt
      link: /superstep/vi/
      lang: vi

extra_javascript:
  - javascripts/lang-switch.js

plugins:
  - search

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.snippets:
      base_path: [..]
      check_paths: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true

