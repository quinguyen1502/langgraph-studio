project_name: langgraph-studio
project_preset: web-app
one_line_description: Internal drag-and-drop builder that designs, compiles, runs
  and imports LangGraph workflows from a browser.
problem_statement: Building and debugging LangGraph agents currently requires writing
  Python by hand; the team wants a visual, internal tool to design graphs, run them
  with live per-node feedback, and inspect existing LangGraph repositories, both for
  internal use and for learning LangGraph concepts.
intended_outcome: Team members can sign in, visually compose a workflow (Start, LLM,
  Tool/API, Condition, End), run it with live per-node status over WebSocket, review
  run history, and import an existing LangGraph repo to visualise and run its original
  graph.
primary_users: Internal developers and learners (Vietnamese-speaking team) building
  or studying LangGraph agents; the project owner as administrator.
goals: '- Visual design of LangGraph StateGraphs without hand-written boilerplate

  - Deterministic offline demo (mock LLM) so the tool works without API keys

  - Live per-node execution feedback and persisted run history

  - Import and visualise existing LangGraph repos and run their original code

  - Serve as a learning aid for LangGraph concepts'
non_goals: '- Public multi-tenant SaaS

  - Replacing the official LangGraph Platform / Studio for production deployments

  - Editing imported repo source code from the canvas'
mvp_scope: 'Implemented (observed in repository at commit 2c2d401):

  - React Flow canvas with drag-drop palette (Start, LLM, Tool/API, Condition, End),
  connect/delete, config panel, state schema editor

  - Tailwind CSS v4 + shadcn/ui UI, dark mode toggle

  - FastAPI backend: workflow JSON {nodes, edges, state} CRUD in SQLite, graph validation,
  compiler to langgraph StateGraph (add_node/add_edge/add_conditional_edges on state-field
  value vs edge labels)

  - LLM node (OpenAI-compatible via OPENAI_API_KEY, deterministic mock otherwise),
  Tool node (HTTP request or registered Python function, example lookup_order)

  - WebSocket run streaming with per-node started/finished, duration and state delta;
  run history persisted

  - Email/password auth (PBKDF2 hashing, JWT), register/login/me, per-user workflow
  ownership, seeded demo user

  - Workflow list page (search, create, rename, duplicate, delete with confirm), login/register
  pages, react-router guards

  - Import LangGraph repo (GitHub URL or zip): per-import venv, langgraph.json / StateGraph
  scan, subprocess inspection via get_graph(xray), conversion to read-only Code nodes
  with dagre auto-layout, run of original graph in subprocess with streamed events
  and clear missing-key errors

  - Seeded customer-support example workflow; pytest suite (19 tests) and npm build'
post_mvp_scope: '- Real LLM provider configuration (OpenAI, Anthropic, others) with
  per-workflow credentials

  - Human-in-the-loop (interrupts, approval nodes, resume)

  - API / webhook triggers for workflows

  - Workflow versioning and diff/rollback

  - Subgraphs and parallel branches (fan-out/fan-in) in the builder

  - RAG nodes (retriever / vector store)

  - MCP tool integration

  - Postgres + Redis + Docker Compose deployment

  - Container-sandboxed repo imports

  - Observability (tracing, LangSmith/OpenTelemetry, metrics)

  - RBAC and workflow sharing'
out_of_scope: '- Public internet exposure without hardening

  - Billing / multi-tenant isolation

  - Mobile apps'
core_flows: '1. Sign in (or register) -> workflow list

  2. Create / open workflow -> drag nodes, connect, configure, edit state schema ->
  Save

  3. Run with JSON input -> live node highlighting and logs -> run saved to history

  4. Import repo (URL or zip) -> progress log -> pick graph -> imported read-only
  workflow -> run original graph

  5. Rename / duplicate / delete workflows; logout'
constraints: '- Internal use only; single SQLite file for MVP

  - Must run offline in mock mode without API keys

  - Imported repo code is arbitrary and must only run in a subprocess with its own
  venv (not the server process)

  - UI copy primarily Vietnamese'
integrations: '- OpenAI-compatible chat completions API (optional, via OPENAI_API_KEY
  / OPENAI_BASE_URL)

  - GitHub (public clone) for repo import

  - uv / pip for per-import virtualenvs'
